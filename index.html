<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>방문자 통계</title><style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:rgba(255,255,255,.08);--tx:#f5f5f7;--sub:#8e8e93;--blue:#0a84ff;--green:#30d158}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}.sub{color:var(--sub);font-size:13px;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.chip{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx);font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px}
.total{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.total b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--blue)}.total span{color:var(--sub);font-size:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.nm{font-weight:600;font-size:16px}
.ct{font-size:28px;font-weight:700;letter-spacing:-.02em}.ct small{font-size:14px;color:var(--sub);font-weight:400;margin-left:2px}
.bar{height:4px;background:var(--card2);border-radius:2px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
svg{display:block;width:100%;height:34px;margin-top:8px}
footer{color:var(--sub);font-size:12px;text-align:center;padding:4px 16px 30px}
</style></head><body>
<header><h1>방문자 통계</h1><div class="sub" id="upd">불러오는 중…</div>
<div class="chips" id="chips"></div></header>
<main><div class="total"><span id="plabel"></span> 전체 방문</div><div id="cards"></div></main>
<footer>매시간 자동 갱신 · 방문 수만 표시</footer>
<script>
const P=[["today","오늘"],["yday","어제"],["7","최근 7일"],["30","최근 30일"],["all","전체"]];let cur="7",D=null;
const kst=d=>new Date(d.getTime()+9*3600e3).toISOString().slice(0,10);
const addD=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function range(){const t=kst(new Date());if(cur=="today")return[t,t];if(cur=="yday"){const y=addD(t,-1);return[y,y]}if(cur=="all")return["2000-01-01",t];return[addD(t,1-(+cur)),t]}
function render(){
 document.getElementById("chips").innerHTML=P.map(([k,l])=>`<button class="chip${k==cur?" on":""}" data-k="${k}">${l}</button>`).join("");
 const[a,b]=range();let tot=0;const rows=D.sites.map(s=>{let c=0;for(const[d,v]of Object.entries(s.days))if(d>=a&&d<=b)c+=v;tot+=c;return{s,c}});
 const mx=Math.max(1,...rows.map(r=>r.c));
 const t=kst(new Date()),sd=[];for(let i=13;i>=0;i--)sd.push(addD(t,-i));
 document.querySelector(".total").innerHTML=`<b>${tot.toLocaleString()}명</b><span>${P.find(p=>p[0]==cur)[1]} 전체 방문</span>`;
 document.getElementById("cards").innerHTML=rows.map(({s,c})=>{const v=sd.map(d=>s.days[d]||0),m=Math.max(1,...v);
  const pts=v.map((x,i)=>`${(i/13*100).toFixed(1)},${(32-x/m*28).toFixed(1)}`).join(" ");
  return `<a class="card" href="${s.url}" target="_blank" rel="noopener"><div class="row"><div class="nm">${s.name}</div><div class="ct">${c.toLocaleString()}<small>명</small></div></div>
  <div class="bar"><i style="width:${c/mx*100}%"></i></div><svg viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#0a84ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></a>`}).join("");
}
document.getElementById("chips").onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;render()}};
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;const u=new Date(d.updated);document.getElementById("upd").textContent="업데이트 "+u.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+" · 최근 14일 추이";render()});
</script></body></html>
