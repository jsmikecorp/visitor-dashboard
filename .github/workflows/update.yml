name: update-stats
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
        env: {GOATCOUNTER_API_TOKEN: "${{ secrets.GOATCOUNTER_API_TOKEN }}"}
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data.json; git diff --cached --quiet || (git commit -m "update stats" && git push)
